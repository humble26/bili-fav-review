<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>收藏夹遗忘曲线 · B站版</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23262a33'/%3E%3Cpath d='M9.5 12.5h13M9.5 16.5h9M9.5 20.5h6' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">📚</div>
        <div class="brand-text">
          <div class="brand-title">收藏夹遗忘曲线</div>
          <div class="brand-sub">BILIBILI REVIEW</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="页面导航"></nav>
      <div class="sidebar-foot">
        <span id="app-version">v—</span>
        <span>本地优先 · 隐私安全</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title" id="page-title">首页</h1>
          <span class="chip" id="login-chip"><i class="dot"></i><span class="chip-text">检查登录状态…</span></span>
        </div>
        <div class="topbar-right">
          <button class="btn btn-primary" id="btn-login">扫码登录</button>
          <button class="btn" id="btn-help">使用指南</button>
          <button class="btn" id="btn-refresh">刷新</button>
        </div>
      </header>

      <div class="content" id="view-root"></div>

      <section class="log-panel" id="log-panel">
        <div class="log-head">
          <button class="log-toggle" id="btn-toggle-log" type="button" title="折叠 / 展开运行日志">
            <span class="caret">▼</span><span class="log-title">运行日志</span>
          </button>
          <button class="btn btn-xs" id="btn-clear-log">清空</button>
        </div>
        <div class="log-body" id="log-body" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <div class="toasts" id="toast-root" aria-live="polite"></div>
  <div class="modal-mask hidden" id="modal-root">
    <div class="modal" id="modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
