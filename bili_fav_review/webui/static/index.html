<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>收藏夹遗忘曲线 · B站版</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23262a33'/%3E%3Cpath d='M 7.75 7.9 C 8.15 13.3, 9.35 17.5, 12.15 19.5 C 15.4 21.8, 20.5 24.4, 24.9 25.4' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='7.75' cy='7.9' r='2.9' fill='%23fff'/%3E%3Ccircle cx='12.15' cy='19.5' r='2.6' fill='%23fff'/%3E%3Ccircle cx='24.9' cy='25.4' r='2.4' fill='%23c06051'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="23" height="23" xmlns="http://www.w3.org/2000/svg"><path d="M 6.4 6.4 C 6.6 10.1, 7.4 13.0, 9.3 14.4 C 11.6 16.0, 15.1 17.8, 18.1 18.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/><circle cx="6.4" cy="6.4" r="2.1" fill="#ffffff"/><circle cx="9.3" cy="14.4" r="1.9" fill="#ffffff"/><circle cx="18.1" cy="18.5" r="1.85" fill="#c06051"/></svg></div>
        <div class="brand-text">
          <div class="brand-title">收藏夹遗忘曲线</div>
          <div class="brand-sub">BILIBILI REVIEW</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="页面导航"></nav>
      <div class="sidebar-foot">
        <span id="app-version">v—</span>
        <span>本地优先 · 隐私安全</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title" id="page-title">首页</h1>
          <span class="chip" id="login-chip"><i class="dot"></i><span class="chip-text">检查登录状态…</span></span>
        </div>
        <div class="topbar-right">
          <button class="btn btn-primary" id="btn-login">扫码登录</button>
          <button class="btn" id="btn-help">使用指南</button>
          <button class="btn" id="btn-refresh">刷新</button>
        </div>
      </header>

      <div class="content" id="view-root"></div>

      <section class="log-panel" id="log-panel">
        <div class="log-head">
          <button class="log-toggle" id="btn-toggle-log" type="button" title="折叠 / 展开运行日志">
            <span class="caret">▼</span><span class="log-title">运行日志</span>
          </button>
          <button class="btn btn-xs" id="btn-clear-log">清空</button>
        </div>
        <div class="log-body" id="log-body" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <div class="toasts" id="toast-root" aria-live="polite"></div>
  <div class="modal-mask hidden" id="modal-root">
    <div class="modal" id="modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
