[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-fav-review"
description = "收藏夹遗忘曲线 · B站版 — 把B站收藏夹变成会主动找你复习的知识库"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "requests>=2.28",
    "qrcode>=7.4",
    "rich>=13.0",
    "genanki>=0.13",
    "pywebview>=5.0",
]

[project.optional-dependencies]
notify = ["win11toast>=0.35"]

[project.scripts]
bili-review = "bili_fav_review.cli:main"

[tool.setuptools.packages.find]
include = ["bili_fav_review*"]

[tool.setuptools.package-data]
"bili_fav_review.webui" = ["static/*", "static/views/*"]

[tool.setuptools.dynamic]
version = { attr = "bili_fav_review.__version__" }
